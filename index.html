<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>AI Speed Camera PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(
        circle at 20% 10%,
        #123c5b,
        transparent 30%
    ),
    radial-gradient(
        circle at 80% 90%,
        #35104d,
        transparent 35%
    ),
    #03060a;

    color:white;

    font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

    padding:8px;

}


.header{

    text-align:center;

    margin:7px auto 13px;

}


.header h1{

    font-size:28px;

    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #00eaff,
        #ffffff,
        #00ff88
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

}


.header p{

    margin-top:5px;

    color:#9aa5b1;

    font-size:13px;

}


.cameraBox{

    width:100%;

    max-width:1000px;

    margin:auto;

    position:relative;

    overflow:hidden;

    border-radius:22px;

    background:#000;

    border:2px solid #26313b;

    box-shadow:
    0 0 35px
    rgba(0,220,255,.18);

}


video{

    width:100%;

    height:auto;

    display:block;

    background:#000;

    object-fit:cover;

}


canvas{

    position:absolute;

    left:0;

    top:0;

    width:100%;

    height:100%;

    pointer-events:none;

}


.speedDisplay{

    position:absolute;

    top:14px;

    right:14px;

    min-width:125px;

    padding:10px;

    text-align:center;

    border-radius:16px;

    background:
    rgba(0,0,0,.84);

    border:2px solid #00eaff;

    box-shadow:
    0 0 20px
    rgba(0,234,255,.25);

}


.speedNumber{

    font-size:35px;

    font-weight:900;

    color:#00ff88;

}


.speedUnit{

    font-size:12px;

    color:#b8c1ca;

}


.speedState{

    margin-top:4px;

    font-size:12px;

    font-weight:bold;

}


.controls{

    width:100%;

    max-width:1000px;

    margin:13px auto;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:9px;

}


button{

    border:0;

    padding:15px 7px;

    border-radius:14px;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        #008cff,
        #00d9ff
    );

}


button:active{

    transform:scale(.96);

}


.stop{

    background:
    linear-gradient(
        135deg,
        #ff304f,
        #d50029
    );

}


.status{

    width:100%;

    max-width:1000px;

    margin:10px auto;

    padding:13px;

    text-align:center;

    border-radius:14px;

    background:#10161e;

    color:#00eaff;

    font-size:14px;

}


.settings{

    width:100%;

    max-width:1000px;

    margin:14px auto;

    padding:16px;

    border-radius:18px;

    background:
    rgba(255,255,255,.045);

    border:
    1px solid
    rgba(255,255,255,.08);

}


.settings h2{

    font-size:18px;

    margin-bottom:14px;

}


.row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin:11px 0;

    font-size:14px;

    color:#cbd3db;

}


input{

    width:110px;

    padding:9px;

    border-radius:9px;

    border:
    1px solid #39434e;

    background:#05080c;

    color:white;

    text-align:center;

    font-size:15px;

    outline:none;

}


.vehicleList{

    width:100%;

    max-width:1000px;

    margin:15px auto;

}


.vehicleCard{

    background:#0d131a;

    border:
    1px solid
    rgba(0,234,255,.15);

    border-radius:15px;

    padding:13px;

    margin-bottom:9px;

}


.vehicleCard.over{

    border-color:#ff304f;

    box-shadow:
    0 0 16px
    rgba(255,48,79,.18);

}


.vehicleTop{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

}


.vehicleTitle{

    font-size:16px;

    font-weight:bold;

}


.vehicleSpeed{

    font-size:23px;

    font-weight:900;

    color:#00ff88;

}


.vehicleCard.over .vehicleSpeed{

    color:#ff304f;

}


.vehicleInfo{

    margin-top:7px;

    line-height:1.7;

    font-size:13px;

    color:#cbd3db;

}


.plateBox{

    margin-top:8px;

    padding:9px;

    border-radius:8px;

    background:#05080c;

    color:#ffd84d;

    font-weight:bold;

    font-size:15px;

}


.developer{

    width:100%;

    max-width:1000px;

    margin:20px auto;

    padding:17px 10px;

    text-align:center;

    border-top:
    1px solid
    rgba(255,255,255,.08);

}


.developerName{

    font-size:16px;

    font-weight:bold;

}


.developerPhone{

    color:#89939e;

    margin-top:4px;

    font-size:13px;

}


@media(max-width:500px){

    .header h1{

        font-size:25px;

    }

    .speedDisplay{

        top:9px;

        right:9px;

        min-width:105px;

    }

    .speedNumber{

        font-size:28px;

    }

    button{

        font-size:13px;

    }

}

</style>

</head>


<body>


<div class="header">

<h1>
🚗 AI SPEED CAMERA PRO
</h1>

<p>
Car • Bike • Bus • Truck • Speed • Number Plate
</p>

</div>


<div class="cameraBox">

<video
id="video"
autoplay
muted
playsinline>
</video>


<canvas
id="canvas">
</canvas>


<div class="speedDisplay">

<div
id="speedNumber"
class="speedNumber">
0
</div>

<div class="speedUnit">
KM/H
</div>

<div
id="speedState"
class="speedState">
WAITING
</div>

</div>

</div>


<div class="controls">

<button onclick="startCamera()">
📷 CAMERA ON
</button>

<button
class="stop"
onclick="stopCamera()">
⛔ CAMERA OFF
</button>

</div>


<div
id="status"
class="status">

🔴 Camera বন্ধ আছে

</div>


<div class="settings">

<h2>
⚙️ Speed Camera Settings
</h2>


<div class="row">

<span>
🚦 Speed Limit
</span>

<input
id="speedLimit"
type="number"
value="60"
min="1">

</div>


<div class="row">

<span>
📏 দুই লাইনের দূরত্ব
</span>

<input
id="lineDistance"
type="number"
value="10"
min="1"
step=".5">

</div>


<div class="row">

<span>
🎯 AI Confidence %
</span>

<input
id="confidence"
type="number"
value="45"
min="20"
max="95">

</div>

</div>


<div
id="vehicleList"
class="vehicleList">

<div class="vehicleCard">

🚗 Vehicle detect করার অপেক্ষা...

</div>

</div>


<div class="developer">

<div class="developerName">

👨‍💻 Developer: Maruf Hossain

</div>

<div class="developerPhone">

📞 +8801892149781

</div>

</div>



<script>


/* =================================================
ELEMENTS
================================================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const statusBox =
document.getElementById("status");

const speedNumber =
document.getElementById("speedNumber");

const speedState =
document.getElementById("speedState");

const vehicleList =
document.getElementById("vehicleList");


/* =================================================
VARIABLES
================================================= */

let stream = null;

let model = null;

let running = false;

let detecting = false;

let predictions = [];

let nextID = 1;

let tracked = [];

let ocrRunning = false;


/* =================================================
VEHICLE TYPES
================================================= */

const vehicleTypes = [

"car",

"truck",

"bus",

"motorcycle"

];


/* =================================================
START CAMERA
================================================= */

async function startCamera(){

try{

if(running){

return;

}


statusBox.innerText =
"🟡 Camera চালু হচ্ছে...";


stream =
await navigator.mediaDevices.getUserMedia({

video:{

facingMode:{
ideal:"environment"
},

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30,
max:30
}

},

audio:false

});


video.srcObject =
stream;


await video.play();


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


statusBox.innerText =
"🟡 AI model loading...";


if(!model){

model =
await cocoSsd.load();

}


running = true;


statusBox.innerText =
"🟢 AI CAMERA READY";


runDetection();


}

catch(error){

console.error(error);

statusBox.innerText =
"❌ Camera Error: " +
error.message;

}

}


/* =================================================
STOP
================================================= */

function stopCamera(){

running = false;

detecting = false;

tracked = [];

predictions = [];

if(stream){

stream
.getTracks()
.forEach(
t => t.stop()
);

stream = null;

}


video.srcObject = null;


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


speedNumber.innerText =
"0";

speedState.innerText =
"WAITING";


statusBox.innerText =
"🔴 Camera বন্ধ আছে";


vehicleList.innerHTML =
`
<div class="vehicleCard">
🚗 Camera বন্ধ
</div>
`;

}


/* =================================================
MAIN DETECTION
================================================= */

async function runDetection(){

if(!running)
return;


if(
!detecting &&
video.readyState >= 2
){

detecting = true;


try{

predictions =
await model.detect(
video
);


updateTracking(
predictions
);

}

catch(error){

console.log(error);

}


detecting = false;

}


draw();


requestAnimationFrame(
runDetection
);

}


/* =================================================
TRACKING
================================================= */

function updateTracking(list){

const confidence =
Number(
document.getElementById(
"confidence"
).value
) / 100;


const detected =
list.filter(
p =>

vehicleTypes.includes(
p.class
)

&&

p.score >=
confidence
);


const now =
performance.now();


const matched =
new Set();


/*
==============================================
MATCH CURRENT VEHICLE WITH OLD VEHICLE
==============================================
*/

detected.forEach(
p => {

const [
x,
y,
w,
h
] = p.bbox;


const cx =
x + w/2;


const cy =
y + h/2;


let best = null;

let bestDistance =
Infinity;


tracked.forEach(
v => {

if(
matched.has(v.id)
)
return;


if(
v.class !==
p.class
)
return;


const dx =
cx - v.cx;


const dy =
cy - v.cy;


const d =
Math.sqrt(
dx*dx +
dy*dy
);


/*
Larger box = larger matching area
*/

const maxMove =
Math.max(
w,
h
) * 1.5;


if(
d <
maxMove &&
d <
bestDistance
){

best =
v;

bestDistance =
d;

}

});


/*
==============================================
NEW VEHICLE
==============================================
*/

if(!best){

best = {

id:
nextID++,

class:
p.class,

x,
y,
w,
h,

cx,
cy,

score:
p.score,

previousY:
cy,

lastTime:
now,

startPassed:false,

startTime:null,

finishPassed:false,

speed:0,

plate:
"Plate খোঁজা হচ্ছে..."

};

tracked.push(
best
);

matched.add(
best.id
);

return;

}


/*
==============================================
UPDATE VEHICLE
==============================================
*/

matched.add(
best.id
);


const oldY =
best.cy;


best.x = x;

best.y = y;

best.w = w;

best.h = h;

best.previousY =
oldY;

best.cx = cx;

best.cy = cy;

best.score =
p.score;


/* =================================================
LINES
================================================= */

const startLine =
canvas.height * 0.52;

const finishLine =
canvas.height * 0.72;


/* =================================================
START LINE CROSS
================================================= */

if(

!best.startPassed

&&

oldY <
startLine

&&

cy >=
startLine

){

best.startPassed =
true;

best.startTime =
now;

best.speed = 0;

speedState.innerText =
"⏱️ TIMING";

speedState.style.color =
"#00eaff";

}


/* =================================================
FINISH LINE CROSS
================================================= */

if(

best.startPassed

&&

!best.finishPassed

&&

oldY <
finishLine

&&

cy >=
finishLine

){

best.finishPassed =
true;


const elapsed =
(
now -
best.startTime
) / 1000;


const distance =
Number(
document.getElementById(
"lineDistance"
).value
);


if(
elapsed > 0 &&
distance > 0
){

const kmh =
(
distance /
elapsed
) * 3.6;


best.speed =
Math.round(
Math.min(
300,
Math.max(
0,
kmh
)
)
);

}


/*
Read plate after
vehicle reaches finish
*/

readPlate(
best
);


/*
Show latest speed
*/

showMainSpeed(
best.speed
);


/*
Prepare for another pass
*/

setTimeout(
() => {

best.startPassed =
false;

best.finishPassed =
false;

best.startTime =
null;

},
1500
);

}

});


/*
==============================================
REMOVE LOST VEHICLES
==============================================
*/

tracked =
tracked.filter(
v =>

now -
v.lastTime
<
2000

);


updateCards();

}


/* =================================================
MAIN SPEED DISPLAY
================================================= */

function showMainSpeed(speed){

speedNumber.innerText =
speed;


const limit =
Number(
document.getElementById(
"speedLimit"
).value
);


if(
speed > limit
){

speedNumber.style.color =
"#ff304f";

speedState.innerText =
"🔴 OVERSPEED";

speedState.style.color =
"#ff304f";

}

else{

speedNumber.style.color =
"#00ff88";

speedState.innerText =
"🟢 SPEED DETECTED";

speedState.style.color =
"#00ff88";

}

}


/* =================================================
NUMBER PLATE OCR
================================================= */

async function readPlate(vehicle){

if(
ocrRunning
)
return;


if(
vehicle.w < 35 ||
vehicle.h < 35
){

vehicle.plate =
"Plate too small";

return;

}


ocrRunning = true;


try{

/*
==============================================
CREATE CROPPED VEHICLE IMAGE
==============================================
*/

const temp =
document.createElement(
"canvas"
);


const marginX =
vehicle.w * .05;


const marginY =
vehicle.h * .05;


const sx =
Math.max(
0,
vehicle.x -
marginX
);


const sy =
Math.max(
0,
vehicle.y -
marginY
);


const sw =
Math.min(
video.videoWidth -
sx,
vehicle.w +
marginX*2
);


const sh =
Math.min(
video.videoHeight -
sy,
vehicle.h +
marginY*2
);


temp.width =
Math.max(
300,
Math.floor(sw * 2)
);


temp.height =
Math.max(
200,
Math.floor(sh * 2)
);


const tctx =
temp.getContext(
"2d"
);


tctx.drawImage(

video,

sx,
sy,
sw,
sh,

0,
0,
temp.width,
temp.height

);


/*
==============================================
IMAGE ENHANCEMENT
==============================================
*/

const img =
tctx.getImageData(
0,
0,
temp.width,
temp.height
);


const data =
img.data;


for(
let i=0;
i<data.length;
i+=4
){

const r =
data[i];

const g =
data[i+1];

const b =
data[i+2];


const gray =
0.299*r +
0.587*g +
0.114*b;


const value =
gray > 125
? 255
: 0;


data[i] =
value;

data[i+1] =
value;

data[i+2] =
value;

}


tctx.putImageData(
img,
0,
0
);


/*
==============================================
OCR
==============================================
*/

const result =
await Tesseract.recognize(

temp,

"eng",

{

logger:
m => {

if(
m.status ===
"recognizing text"
){

vehicle.plate =
"OCR " +
Math.round(
m.progress * 100
) +
"%";

updateCards();

}

}

}

);


let text =
result.data.text
.toUpperCase();


/*
Keep plate-like characters
*/

text =
text
.replace(
/[^A-Z0-9\u0980-\u09FF\s-]/g,
" "
)
.replace(
/\s+/g,
" "
)
.trim();


/*
Remove very short OCR
*/

if(
text.length >= 3
){

vehicle.plate =
text;

}

else{

vehicle.plate =
"Number Plate পরিষ্কার নয়";

}


}

catch(error){

console.log(
"Plate OCR:",
error
);

vehicle.plate =
"Plate read হয়নি";

}


ocrRunning = false;

updateCards();

}


/* =================================================
VEHICLE CARDS
================================================= */

function updateCards(){

if(
tracked.length === 0
){

vehicleList.innerHTML =
`
<div class="vehicleCard">
🚗 কোনো vehicle detect হয়নি
</div>
`;

return;

}


const limit =
Number(
document.getElementById(
"speedLimit"
).value
);


let html = "";


tracked.forEach(
v => {

const over =
v.speed >
limit;


const icon =
v.class ===
"car"
? "🚗"
:
v.class ===
"motorcycle"
? "🏍️"
:
v.class ===
"bus"
? "🚌"
:
"🚚";


html += `

<div class="vehicleCard ${over ? "over" : ""}">

<div class="vehicleTop">

<div class="vehicleTitle">

${icon}

Vehicle #${v.id}

${v.class.toUpperCase()}

</div>


<div class="vehicleSpeed">

${v.speed}

KM/H

</div>

</div>


<div class="vehicleInfo">

🎯 Confidence:
<b>
${Math.round(v.score*100)}%
</b>

<br>

📍 Status:
<b>
${
over
? "🔴 OVERSPEED"
: v.startPassed
? "⏱️ SPEED TIMING"
: v.speed > 0
? "🟢 SPEED FOUND"
: "🔍 TRACKING"
}
</b>

</div>


<div class="plateBox">

🔢 Number Plate:

${v.plate}

</div>

</div>

`;

});


vehicleList.innerHTML =
html;

}


/* =================================================
DRAW
================================================= */

function draw(){

if(!running)
return;


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


const W =
canvas.width;

const H =
canvas.height;


const startLine =
H * .52;

const finishLine =
H * .72;


/*
START LINE
*/

ctx.strokeStyle =
"#00ff88";

ctx.lineWidth = 4;

ctx.beginPath();

ctx.moveTo(
W*.03,
startLine
);

ctx.lineTo(
W*.97,
startLine
);

ctx.stroke();


/*
FINISH LINE
*/

ctx.strokeStyle =
"#00eaff";

ctx.beginPath();

ctx.moveTo(
W*.03,
finishLine
);

ctx.lineTo(
W*.97,
finishLine
);

ctx.stroke();


/*
LABELS
*/

ctx.font =
"bold 14px Arial";


ctx.fillStyle =
"#00ff88";

ctx.fillText(
"START LINE",
15,
startLine-10
);


ctx.fillStyle =
"#00eaff";

ctx.fillText(
"FINISH LINE",
15,
finishLine-10
);


/*
VEHICLE BOX
*/

tracked.forEach(
v => {

const limit =
Number(
document.getElementById(
"speedLimit"
).value
);


const over =
v.speed >
limit;


ctx.strokeStyle =
over
? "#ff304f"
: "#00ff88";


ctx.lineWidth = 4;


ctx.strokeRect(
v.x,
v.y,
v.w,
v.h
);


/*
LABEL BACKGROUND
*/

ctx.fillStyle =
"rgba(0,0,0,.82)";


const labelW =
240;


ctx.fillRect(
v.x,
Math.max(
0,
v.y-58
),
labelW,
55
);


/*
VEHICLE LABEL
*/

ctx.fillStyle =
over
? "#ff304f"
: "#00ff88";


ctx.font =
"bold 14px Arial";


ctx.fillText(

"#" +
v.id +
" " +
v.class.toUpperCase(),

v.x+7,

Math.max(
17,
v.y-38
)

);


ctx.fillText(

"SPEED: " +
v.speed +
" KM/H",

v.x+7,

Math.max(
35,
v.y-19
)

);


if(
v.startPassed
){

ctx.fillStyle =
"#00eaff";

ctx.fillText(
"TIMING...",
v.x+120,
Math.max(
35,
v.y-19
)
);

}

});


/*
LIVE INDICATOR
*/

ctx.fillStyle =
"rgba(0,0,0,.75)";


ctx.fillRect(
10,
10,
175,
35
);


ctx.fillStyle =
"#00ff88";


ctx.font =
"bold 14px Arial";


ctx.fillText(
"● AI CAMERA LIVE",
20,
33
);

}


/* =================================================
VISIBILITY
================================================= */

document.addEventListener(
"visibilitychange",
function(){

/*
Do nothing.
Camera state থাকবে.
*/

});

</script>

</body>
</html>
