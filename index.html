<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#05080d">

<title>Speed Camera</title>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<!-- COCO-SSD Object Detection -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(
        circle at 20% 10%,
        #123c5b,
        transparent 30%
    ),
    radial-gradient(
        circle at 80% 90%,
        #35104d,
        transparent 35%
    ),
    #03060a;

    color:white;

    font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

    padding:12px;

}


/* =========================
HEADER
========================= */

.header{

    text-align:center;

    margin:8px auto 15px;

}

.header h1{

    font-size:30px;

    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #00eaff,
        #ffffff,
        #00ff88
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

}

.header p{

    margin-top:6px;

    color:#9aa5b1;

    font-size:13px;

}


/* =========================
CAMERA
========================= */

.cameraBox{

    width:100%;

    max-width:950px;

    margin:auto;

    position:relative;

    overflow:hidden;

    border-radius:22px;

    background:#000;

    border:
    2px solid
    #26313b;

    box-shadow:
    0 0 35px
    rgba(0,220,255,.16);

}

video{

    width:100%;

    height:auto;

    min-height:300px;

    display:block;

    background:#000;

    object-fit:cover;

}

canvas{

    position:absolute;

    left:0;

    top:0;

    width:100%;

    height:100%;

    pointer-events:none;

}


/* =========================
SPEED DISPLAY
========================= */

.speedDisplay{

    position:absolute;

    top:18px;

    right:18px;

    min-width:125px;

    padding:12px;

    text-align:center;

    border-radius:15px;

    background:
    rgba(0,0,0,.82);

    border:
    2px solid
    #00eaff;

    box-shadow:
    0 0 20px
    rgba(0,234,255,.25);

}

.speedNumber{

    font-size:34px;

    font-weight:900;

    color:#00ff88;

}

.speedUnit{

    font-size:13px;

    color:#b8c1ca;

}

.speedState{

    margin-top:4px;

    font-size:12px;

    font-weight:bold;

}


/* =========================
BUTTONS
========================= */

.controls{

    width:100%;

    max-width:950px;

    margin:14px auto;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:10px;

}

button{

    border:0;

    padding:15px 8px;

    border-radius:14px;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        #008cff,
        #00d9ff
    );

}

button:active{

    transform:scale(.96);

}

.stop{

    background:
    linear-gradient(
        135deg,
        #ff304f,
        #d50029
    );

}


/* =========================
STATUS
========================= */

.status{

    width:100%;

    max-width:950px;

    margin:10px auto;

    padding:14px;

    text-align:center;

    border-radius:14px;

    background:#10161e;

    color:#00eaff;

    font-size:14px;

}


/* =========================
SETTINGS
========================= */

.settings{

    width:100%;

    max-width:950px;

    margin:15px auto;

    padding:18px;

    border-radius:18px;

    background:
    rgba(255,255,255,.045);

    border:
    1px solid
    rgba(255,255,255,.08);

}

.settings h2{

    font-size:18px;

    margin-bottom:15px;

}

.row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin:12px 0;

    font-size:14px;

    color:#cbd3db;

}

input{

    width:110px;

    padding:10px;

    border-radius:9px;

    border:
    1px solid
    #39434e;

    background:#05080c;

    color:white;

    text-align:center;

    font-size:15px;

    outline:none;

}


/* =========================
VEHICLE INFO
========================= */

.vehicleInfo{

    width:100%;

    max-width:950px;

    margin:15px auto;

    padding:15px;

    border-radius:16px;

    background:#0d131a;

    border:
    1px solid
    rgba(0,234,255,.1);

    line-height:1.8;

    font-size:14px;

}


/* =========================
DEVELOPER
========================= */

.developer{

    width:100%;

    max-width:950px;

    margin:22px auto;

    padding:18px 10px;

    text-align:center;

    border-top:
    1px solid
    rgba(255,255,255,.08);

}

.developerName{

    color:white;

    font-size:17px;

    font-weight:bold;

}

.developerPhone{

    color:#89939e;

    margin-top:4px;

    font-size:14px;

}


/* =========================
MOBILE
========================= */

@media(max-width:500px){

    body{

        padding:8px;

    }

    .header h1{

        font-size:26px;

    }

    video{

        min-height:280px;

    }

    .speedDisplay{

        top:10px;

        right:10px;

        min-width:105px;

    }

    .speedNumber{

        font-size:28px;

    }

    button{

        font-size:14px;

    }

}

</style>

</head>


<body>


<!-- =========================
HEADER
========================= -->

<div class="header">

    <h1>
        🚗 Speed Camera
    </h1>

    <p>
        📷 AI Vehicle Detection & Speed Estimate
    </p>

</div>


<!-- =========================
CAMERA
========================= -->

<div class="cameraBox">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas
        id="canvas">
    </canvas>


    <!-- SPEED -->

    <div class="speedDisplay">

        <div
            id="speedNumber"
            class="speedNumber">

            0

        </div>

        <div class="speedUnit">

            KM/H

        </div>

        <div
            id="speedState"
            class="speedState">

            WAITING

        </div>

    </div>

</div>


<!-- =========================
BUTTONS
========================= -->

<div class="controls">

    <button
        onclick="startCamera()">

        📷 CAMERA ON

    </button>


    <button
        class="stop"
        onclick="stopCamera()">

        ⛔ CAMERA OFF

    </button>

</div>


<!-- =========================
STATUS
========================= -->

<div
    id="status"
    class="status">

    🔴 Camera বন্ধ আছে

</div>


<!-- =========================
SETTINGS
========================= -->

<div class="settings">

    <h2>
        ⚙️ Speed Settings
    </h2>


    <div class="row">

        <span>
            🚦 Speed Limit
        </span>

        <input
            id="speedLimit"
            type="number"
            value="60"
            min="1">

    </div>


    <div class="row">

        <span>
            📏 Line Distance (meter)
        </span>

        <input
            id="lineDistance"
            type="number"
            value="10"
            min="1"
            step="0.5">

    </div>


    <div class="row">

        <span>
            🎯 Detection Confidence
        </span>

        <input
            id="confidence"
            type="number"
            value="50"
            min="20"
            max="95">

    </div>

</div>


<!-- =========================
VEHICLE INFORMATION
========================= -->

<div
    id="vehicleInfo"
    class="vehicleInfo">

    🚗 Vehicle:
    <b>Waiting...</b>

    <br>

    🎯 Detection:
    <b>Waiting for camera</b>

    <br>

    ⏱️ Timer:
    <b>0.00 sec</b>

</div>


<!-- =========================
DEVELOPER
========================= -->

<div class="developer">

    <div class="developerName">

        👨‍💻 Developer: Maruf Hossain

    </div>

    <div class="developerPhone">

        📞 +8801892149781

    </div>

</div>



<script>

/* =====================================================
   VARIABLES
===================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const statusBox =
document.getElementById("status");

const speedNumber =
document.getElementById("speedNumber");

const speedState =
document.getElementById("speedState");

const vehicleInfo =
document.getElementById("vehicleInfo");


let stream = null;

let model = null;

let running = false;

let detecting = false;


/*
   Tracking information
*/

let trackedVehicle = null;

let previousCenter = null;

let firstLineTime = null;

let lastDetectionTime = 0;

let lastPrediction = [];


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            statusBox.innerText =
            "❌ Browser camera support করে না";

            return;

        }


        statusBox.innerText =
        "🟡 Camera permission চাওয়া হচ্ছে...";


        stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        canvas.width =
        video.videoWidth;

        canvas.height =
        video.videoHeight;


        statusBox.innerText =
        "🟡 AI model loading হচ্ছে...";


        /*
           Load COCO-SSD
        */

        model =
        await cocoSsd.load();


        running = true;


        statusBox.innerText =
        "🟢 CAMERA + AI READY";


        vehicleInfo.innerHTML =
        "🚗 Vehicle: <b>Searching...</b>" +
        "<br>🎯 Detection: <b>AI Active</b>" +
        "<br>⏱️ Timer: <b>0.00 sec</b>";


        detectLoop();

    }

    catch(error){

        console.error(error);


        if(
            error.name ===
            "NotAllowedError"
        ){

            statusBox.innerText =
            "❌ Camera Permission Allow করুন";

        }

        else if(
            error.name ===
            "NotReadableError"
        ){

            statusBox.innerText =
            "❌ Camera অন্য App ব্যবহার করছে";

        }

        else{

            statusBox.innerText =
            "❌ Error: " +
            error.message;

        }

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    running = false;


    if(stream){

        stream
        .getTracks()
        .forEach(
            track => track.stop()
        );

        stream = null;

    }


    video.srcObject =
    null;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    trackedVehicle = null;

    previousCenter = null;

    firstLineTime = null;


    speedNumber.innerText =
    "0";

    speedState.innerText =
    "WAITING";


    statusBox.innerText =
    "🔴 Camera বন্ধ আছে";


    vehicleInfo.innerHTML =
    "🚗 Vehicle: <b>Waiting...</b>" +
    "<br>🎯 Detection: <b>Camera Off</b>" +
    "<br>⏱️ Timer: <b>0.00 sec</b>";

}


/* =====================================================
   DETECTION LOOP
===================================================== */

async function detectLoop(){

    if(!running)
        return;


    if(
        !detecting &&
        video.readyState >= 2
    ){

        detecting = true;


        try{

            const predictions =
            await model.detect(
                video
            );


            lastPrediction =
            predictions;


            processVehicles(
                predictions
            );

        }

        catch(error){

            console.error(
                error
            );

        }


        detecting = false;

    }


    drawInterface();


    requestAnimationFrame(
        detectLoop
    );

}


/* =====================================================
   PROCESS VEHICLES
===================================================== */

function processVehicles(
    predictions
){

    const confidenceLimit =
    Number(
        document.getElementById(
            "confidence"
        ).value
    ) / 100;


    /*
       Objects considered vehicles
    */

    const vehicleClasses = [

        "car",

        "truck",

        "bus",

        "motorcycle"

    ];


    const vehicles =
    predictions.filter(
        item =>
        vehicleClasses.includes(
            item.class
        )
        &&
        item.score >=
        confidenceLimit
    );


    if(
        vehicles.length === 0
    ){

        trackedVehicle = null;

        vehicleInfo.innerHTML =
        "🚗 Vehicle: <b>None detected</b>" +
        "<br>🎯 Detection: <b>Searching...</b>" +
        "<br>⏱️ Timer: <b>0.00 sec</b>";

        return;

    }


    /*
       Select largest vehicle
       because nearby vehicle
       usually has larger box.
    */

    let vehicle =
    vehicles.sort(
        (a,b) =>
        (
            b.bbox[2] *
            b.bbox[3]
        )
        -
        (
            a.bbox[2] *
            a.bbox[3]
        )
    )[0];


    const x =
    vehicle.bbox[0];

    const y =
    vehicle.bbox[1];

    const w =
    vehicle.bbox[2];

    const h =
    vehicle.bbox[3];


    const centerX =
    x + w / 2;

    const centerY =
    y + h / 2;


    const now =
    performance.now();


    /*
       First detection
    */

    if(
        !trackedVehicle
    ){

        trackedVehicle = {

            class:
            vehicle.class,

            x,
            y,
            w,
            h,

            centerX,
            centerY

        };

        previousCenter = {

            x:centerX,

            y:centerY,

            time:now

        };

        return;

    }


    /*
       Update tracking
    */

    const oldY =
    trackedVehicle.centerY;


    trackedVehicle = {

        class:
        vehicle.class,

        x,
        y,
        w,
        h,

        centerX,
        centerY

    };


    /*
       Speed lines
    */

    const line1 =
    canvas.height * 0.52;

    const line2 =
    canvas.height * 0.72;


    /*
       Detect movement direction
    */

    if(
        oldY < line1 &&
        centerY >= line1 &&
        !firstLineTime
    ){

        firstLineTime =
        performance.now();


        speedState.innerText =
        "⏱️ TIMING";


        speedState.style.color =
        "#00eaff";

    }


    /*
       Second line crossed
    */

    if(
        firstLineTime &&
        oldY < line2 &&
        centerY >= line2
    ){

        const secondTime =
        performance.now();


        const elapsed =
        (
            secondTime -
            firstLineTime
        ) / 1000;


        calculateSpeed(
            elapsed
        );


        /*
           Reset after result
        */

        firstLineTime =
        null;

    }


    /*
       Information
    */

    let timerText =
    "0.00 sec";


    if(firstLineTime){

        timerText =
        (
            (
                performance.now() -
                firstLineTime
            ) / 1000
        ).toFixed(2)
        +
        " sec";

    }


    vehicleInfo.innerHTML =

    "🚗 Vehicle: <b>" +
    vehicle.class +
    "</b>" +

    "<br>🎯 Confidence: <b>" +
    (
        vehicle.score * 100
    ).toFixed(0) +
    "%</b>" +

    "<br>⏱️ Timer: <b>" +
    timerText +
    "</b>";

}


/* =====================================================
   CALCULATE SPEED
===================================================== */

function calculateSpeed(
    elapsed
){

    const distance =
    Number(
        document.getElementById(
            "lineDistance"
        ).value
    );


    if(
        !distance ||
        distance <= 0 ||
        elapsed <= 0
    ){

        return;

    }


    /*
       m/s to km/h

       speed =
       distance / time

       then × 3.6
    */

    const speed =
    (
        distance /
        elapsed
    ) * 3.6;


    const finalSpeed =
    Math.round(
        speed
    );


    speedNumber.innerText =
    finalSpeed;


    const limit =
    Number(
        document.getElementById(
            "speedLimit"
        ).value
    );


    if(
        finalSpeed >
        limit
    ){

        speedState.innerText =
        "🔴 OVERSPEED";

        speedState.style.color =
        "#ff304f";


        speedNumber.style.color =
        "#ff304f";

    }

    else{

        speedState.innerText =
        "🟢 SAFE";

        speedState.style.color =
        "#00ff88";


        speedNumber.style.color =
        "#00ff88";

    }

}


/* =====================================================
   DRAW INTERFACE
===================================================== */

function drawInterface(){

    if(!running)
        return;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const W =
    canvas.width;

    const H =
    canvas.height;


    /*
       Speed lines
    */

    const line1 =
    H * 0.52;

    const line2 =
    H * 0.72;


    /*
       First line
    */

    ctx.strokeStyle =
    "#00ff88";

    ctx.lineWidth =
    4;


    ctx.beginPath();

    ctx.moveTo(
        W * 0.05,
        line1
    );

    ctx.lineTo(
        W * 0.95,
        line1
    );

    ctx.stroke();


    /*
       Second line
    */

    ctx.strokeStyle =
    "#00eaff";


    ctx.beginPath();

    ctx.moveTo(
        W * 0.05,
        line2
    );

    ctx.lineTo(
        W * 0.95,
        line2
    );

    ctx.stroke();


    /*
       Line labels
    */

    ctx.fillStyle =
    "rgba(0,0,0,.72)";


    ctx.fillRect(
        W * 0.05,
        line1 - 35,
        180,
        30
    );


    ctx.fillRect(
        W * 0.05,
        line2 - 35,
        180,
        30
    );


    ctx.fillStyle =
    "#00ff88";


    ctx.font =
    "bold 14px Arial";


    ctx.fillText(
        "START LINE",
        W * 0.05 + 10,
        line1 - 15
    );


    ctx.fillStyle =
    "#00eaff";


    ctx.fillText(
        "FINISH LINE",
        W * 0.05 + 10,
        line2 - 15
    );


    /*
       Draw detected vehicles
    */

    const confidenceLimit =
    Number(
        document.getElementById(
            "confidence"
        ).value
    ) / 100;


    const vehicleClasses = [

        "car",
        "truck",
        "bus",
        "motorcycle"

    ];


    const vehicles =
    lastPrediction.filter(
        item =>
        vehicleClasses.includes(
            item.class
        )
        &&
        item.score >=
        confidenceLimit
    );


    vehicles.forEach(
        vehicle => {

            const [
                x,
                y,
                w,
                h
            ] =
            vehicle.bbox;


            /*
               Box
            */

            ctx.strokeStyle =
            "#00ff88";

            ctx.lineWidth =
            4;


            ctx.strokeRect(
                x,
                y,
                w,
                h
            );


            /*
               Label background
            */

            ctx.fillStyle =
            "rgba(0,0,0,.75)";


            ctx.fillRect(
                x,
                Math.max(
                    0,
                    y - 30
                ),
                180,
                30
            );


            /*
               Label
            */

            ctx.fillStyle =
            "#00ff88";


            ctx.font =
            "bold 14px Arial";


            ctx.fillText(

                vehicle.class
                .toUpperCase()
                +
                " "
                +
                (
                    vehicle.score *
                    100
                ).toFixed(0)
                +
                "%",

                x + 8,

                Math.max(
                    20,
                    y - 10
                )

            );

        }
    );


    /*
       Camera indicator
    */

    ctx.fillStyle =
    "rgba(0,0,0,.75)";


    ctx.fillRect(
        10,
        10,
        160,
        35
    );


    ctx.fillStyle =
    "#00ff88";


    ctx.font =
    "bold 14px Arial";


    ctx.fillText(
        "● AI CAMERA LIVE",
        20,
        33
    );

}


/* =====================================================
   PAGE HIDDEN
===================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.hidden &&
            running
        ){

            stopCamera();

        }

    }
);

</script>


</body>
