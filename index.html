<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI Speed Camera Pro</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    radial-gradient(circle at 20% 10%,#123c5b,transparent 30%),
    radial-gradient(circle at 80% 90%,#35104d,transparent 35%),
    #03060a;
    color:white;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    padding:10px;
}

.header{
    text-align:center;
    margin:8px auto 15px;
}

.header h1{
    font-size:30px;
    font-weight:900;
    background:linear-gradient(90deg,#00eaff,#fff,#00ff88);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.header p{
    margin-top:6px;
    color:#9aa5b1;
    font-size:13px;
}

.cameraBox{
    width:100%;
    max-width:1000px;
    margin:auto;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    background:#000;
    border:2px solid #26313b;
    box-shadow:0 0 35px rgba(0,220,255,.16);
}

video{
    width:100%;
    display:block;
    background:#000;
    object-fit:cover;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.speedDisplay{
    position:absolute;
    top:15px;
    right:15px;
    min-width:125px;
    padding:10px;
    text-align:center;
    border-radius:15px;
    background:rgba(0,0,0,.82);
    border:2px solid #00eaff;
}

.speedNumber{
    font-size:34px;
    font-weight:900;
    color:#00ff88;
}

.speedUnit{
    font-size:12px;
    color:#b8c1ca;
}

.speedState{
    margin-top:3px;
    font-size:12px;
    font-weight:bold;
}

.controls{
    width:100%;
    max-width:1000px;
    margin:14px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    border:0;
    padding:15px 8px;
    border-radius:14px;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#008cff,#00d9ff);
}

button:active{
    transform:scale(.96);
}

.stop{
    background:linear-gradient(135deg,#ff304f,#d50029);
}

.status{
    width:100%;
    max-width:1000px;
    margin:10px auto;
    padding:13px;
    text-align:center;
    border-radius:14px;
    background:#10161e;
    color:#00eaff;
    font-size:14px;
}

.settings{
    width:100%;
    max-width:1000px;
    margin:15px auto;
    padding:17px;
    border-radius:18px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
}

.settings h2{
    font-size:18px;
    margin-bottom:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin:12px 0;
    font-size:14px;
    color:#cbd3db;
}

input{
    width:110px;
    padding:9px;
    border-radius:9px;
    border:1px solid #39434e;
    background:#05080c;
    color:white;
    text-align:center;
    font-size:15px;
    outline:none;
}

.vehicleList{
    width:100%;
    max-width:1000px;
    margin:15px auto;
}

.vehicleCard{
    background:#0d131a;
    border:1px solid rgba(0,234,255,.15);
    border-radius:14px;
    padding:13px;
    margin-bottom:10px;
}

.vehicleCard.overspeed{
    border-color:#ff304f;
    box-shadow:0 0 15px rgba(255,48,79,.15);
}

.vehicleTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.vehicleName{
    font-size:17px;
    font-weight:bold;
}

.vehicleSpeed{
    font-size:24px;
    font-weight:900;
    color:#00ff88;
}

.overspeed .vehicleSpeed{
    color:#ff304f;
}

.plate{
    margin-top:7px;
    padding:8px;
    background:#05080c;
    border-radius:8px;
    color:#ffd84d;
    font-size:15px;
    font-weight:bold;
}

.muted{
    color:#89939e;
}

.developer{
    width:100%;
    max-width:1000px;
    margin:22px auto;
    padding:18px 10px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.08);
}

.developerName{
    font-size:17px;
    font-weight:bold;
}

.developerPhone{
    color:#89939e;
    margin-top:4px;
    font-size:14px;
}

@media(max-width:500px){

    body{
        padding:7px;
    }

    .header h1{
        font-size:25px;
    }

    .speedDisplay{
        top:8px;
        right:8px;
        min-width:105px;
    }

    .speedNumber{
        font-size:27px;
    }

    button{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🚗 AI Speed Camera PRO</h1>
    <p>Vehicle Detection • Speed Estimate • Number Plate OCR</p>
</div>

<div class="cameraBox">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="canvas"></canvas>

    <div class="speedDisplay">

        <div id="speedNumber" class="speedNumber">
            0
        </div>

        <div class="speedUnit">
            KM/H
        </div>

        <div id="speedState" class="speedState">
            WAITING
        </div>

    </div>

</div>

<div class="controls">

    <button onclick="startCamera()">
        📷 CAMERA ON
    </button>

    <button class="stop" onclick="stopCamera()">
        ⛔ CAMERA OFF
    </button>

</div>

<div id="status" class="status">
    🔴 Camera বন্ধ আছে
</div>

<div class="settings">

    <h2>⚙️ Speed Camera Settings</h2>

    <div class="row">
        <span>🚦 Speed Limit</span>
        <input
            id="speedLimit"
            type="number"
            value="60"
            min="1">
    </div>

    <div class="row">
        <span>📏 Line Distance (meter)</span>
        <input
            id="lineDistance"
            type="number"
            value="10"
            min="1"
            step=".5">
    </div>

    <div class="row">
        <span>🎯 Confidence %</span>
        <input
            id="confidence"
            type="number"
            value="50"
            min="20"
            max="95">
    </div>

</div>

<div id="vehicleList" class="vehicleList">

    <div class="vehicleCard">
        🚗 কোনো vehicle detect হয়নি
    </div>

</div>

<div class="developer">

    <div class="developerName">
        👨‍💻 Developer: Maruf Hossain
    </div>

    <div class="developerPhone">
        📞 +8801892149781
    </div>

</div>


<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const statusBox =
document.getElementById("status");

const speedNumber =
document.getElementById("speedNumber");

const speedState =
document.getElementById("speedState");

const vehicleList =
document.getElementById("vehicleList");


let stream = null;
let model = null;
let running = false;
let detecting = false;

let nextVehicleID = 1;

let vehicles = new Map();

let lastPredictions = [];

let ocrBusy = false;


/*
==================================================
VEHICLE TYPES
==================================================
*/

const vehicleClasses = [
    "car",
    "truck",
    "bus",
    "motorcycle"
];


/*
==================================================
START CAMERA
==================================================
*/

async function startCamera(){

    try{

        if(!navigator.mediaDevices){

            statusBox.innerText =
            "❌ Browser camera support করে না";

            return;
        }

        statusBox.innerText =
        "🟡 Camera permission চাওয়া হচ্ছে...";


        stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }
            },

            audio:false
        });


        video.srcObject = stream;

        await video.play();


        canvas.width =
        video.videoWidth;

        canvas.height =
        video.videoHeight;


        statusBox.innerText =
        "🟡 AI model loading হচ্ছে...";


        model =
        await cocoSsd.load();


        running = true;

        statusBox.innerText =
        "🟢 AI CAMERA READY";


        detectLoop();

    }

    catch(error){

        console.error(error);

        statusBox.innerText =
        "❌ " + error.message;

    }

}


/*
==================================================
STOP CAMERA
==================================================
*/

function stopCamera(){

    running = false;

    if(stream){

        stream
        .getTracks()
        .forEach(
            track => track.stop()
        );

        stream = null;
    }

    video.srcObject = null;

    vehicles.clear();

    lastPredictions = [];

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    speedNumber.innerText = "0";

    speedState.innerText = "WAITING";

    statusBox.innerText =
    "🔴 Camera বন্ধ আছে";

    vehicleList.innerHTML =
    `<div class="vehicleCard">
        🚗 Camera বন্ধ
    </div>`;

}


/*
==================================================
DETECTION LOOP
==================================================
*/

async function detectLoop(){

    if(!running)
        return;


    if(
        !detecting &&
        video.readyState >= 2
    ){

        detecting = true;

        try{

            const predictions =
            await model.detect(video);


            lastPredictions =
            predictions;


            processVehicles(
                predictions
            );

        }
        catch(error){

            console.error(error);

        }

        detecting = false;
    }


    drawInterface();


    requestAnimationFrame(
        detectLoop
    );
}


/*
==================================================
PROCESS VEHICLES
==================================================
*/

function processVehicles(predictions){

    const confidence =
    Number(
        document.getElementById(
            "confidence"
        ).value
    ) / 100;


    const detected =
    predictions.filter(
        p =>
        vehicleClasses.includes(
            p.class
        ) &&
        p.score >= confidence
    );


    const now =
    performance.now();


    const usedIDs =
    new Set();


    detected.forEach(
        detection => {

            const [
                x,
                y,
                w,
                h
            ] = detection.bbox;


            const cx =
            x + w / 2;

            const cy =
            y + h / 2;


            /*
            Find closest existing vehicle
            */

            let bestID = null;

            let bestDistance =
            Infinity;


            vehicles.forEach(
                (v,id) => {

                    if(
                        usedIDs.has(id)
                    )
                        return;


                    if(
                        v.class !==
                        detection.class
                    )
                        return;


                    const dx =
                    cx - v.cx;

                    const dy =
                    cy - v.cy;


                    const distance =
                    Math.sqrt(
                        dx*dx +
                        dy*dy
                    );


                    const threshold =
                    Math.max(
                        w,
                        h
                    ) * 0.8;


                    if(
                        distance <
                        threshold &&
                        distance <
                        bestDistance
                    ){

                        bestDistance =
                        distance;

                        bestID = id;

                    }

                }
            );


            /*
            New vehicle
            */

            if(bestID === null){

                bestID =
                nextVehicleID++;


                vehicles.set(
                    bestID,
                    {

                        id:bestID,

                        class:
                        detection.class,

                        score:
                        detection.score,

                        x,
                        y,
                        w,
                        h,

                        cx,
                        cy,

                        lastTime:
                        now,

                        firstLine:false,

                        firstTime:null,

                        speed:0,

                        plate:"Reading..."

                    }
                );

            }

            else{

                const v =
                vehicles.get(
                    bestID
                );


                /*
                Update speed tracking
                */

                const oldY =
                v.cy;

                const oldTime =
                v.lastTime;


                v.x = x;
                v.y = y;
                v.w = w;
                v.h = h;

                v.cx = cx;
                v.cy = cy;

                v.score =
                detection.score;


                v.lastTime =
                now;


                /*
                Speed lines
                */

                const line1 =
                canvas.height * .52;

                const line2 =
                canvas.height * .72;


                /*
                First line
                */

                if(
                    oldY < line1 &&
                    cy >= line1 &&
                    !v.firstLine
                ){

                    v.firstLine = true;

                    v.firstTime = now;

                }


                /*
                Finish line
                */

                if(
                    v.firstLine &&
                    oldY < line2 &&
                    cy >= line2
                ){

                    const elapsed =
                    (
                        now -
                        v.firstTime
                    ) / 1000;


                    const distance =
                    Number(
                        document.getElementById(
                            "lineDistance"
                        ).value
                    );


                    if(
                        elapsed > 0 &&
                        distance > 0
                    ){

                        v.speed =
                        Math.round(
                            (
                                distance /
                                elapsed
                            ) * 3.6
                        );

                    }


                    v.firstLine = false;

                    v.firstTime = null;


                    /*
                    OCR
                    */

                    readNumberPlate(
                        v
                    );

                }

            }


            usedIDs.add(bestID);

        }
    );


    /*
    Remove vehicles that disappeared
    */

    vehicles.forEach(
        (v,id) => {

            if(
                now -
                v.lastTime >
                2500
            ){

                vehicles.delete(id);

            }

        }
    );


    updateVehicleList();

}


/*
==================================================
NUMBER PLATE OCR
==================================================
*/

async function readNumberPlate(vehicle){

    if(ocrBusy)
        return;


    /*
    Crop vehicle area
    */

    const temp =
    document.createElement(
        "canvas"
    );


    const scale = 1;


    temp.width =
    Math.max(
        100,
        Math.floor(
            vehicle.w * scale
        )
    );


    temp.height =
    Math.max(
        60,
        Math.floor(
            vehicle.h * scale
        )
    );


    const tctx =
    temp.getContext("2d");


    tctx.drawImage(
        video,

        vehicle.x,
        vehicle.y,
        vehicle.w,
        vehicle.h,

        0,
        0,
        temp.width,
        temp.height
    );


    ocrBusy = true;


    try{

        const result =
        await Tesseract.recognize(

            temp,

            "eng",

            {

                logger:
                function(info){

                    if(
                        info.status ===
                        "recognizing text"
                    ){

                        vehicle.plate =
                        "OCR " +
                        Math.round(
                            info.progress *
                            100
                        ) +
                        "%";

                        updateVehicleList();

                    }

                }

            }

        );


        let text =
        result.data.text
        .toUpperCase();


        /*
        Keep numbers,
        English letters and
        Bangladesh plate characters.
        */

        text =
        text
        .replace(
            /[^A-Z0-9\u0980-\u09FF\s-]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();


        if(text.length > 1){

            vehicle.plate =
            text;

        }
        else{

            vehicle.plate =
            "Plate not clear";

        }


    }
    catch(error){

        console.error(error);

        vehicle.plate =
        "OCR failed";

    }


    ocrBusy = false;

    updateVehicleList();

}


/*
==================================================
VEHICLE LIST
==================================================
*/

function updateVehicleList(){

    if(vehicles.size === 0){

        vehicleList.innerHTML =
        `<div class="vehicleCard">
            🚗 কোনো vehicle detect হয়নি
        </div>`;

        return;
    }


    const limit =
    Number(
        document.getElementById(
            "speedLimit"
        ).value
    );


    let html = "";


    vehicles.forEach(
        v => {

            const over =
            v.speed > limit;


            const icon =
            getVehicleIcon(
                v.class
            );


            html += `

            <div class="vehicleCard
                ${over ? "overspeed" : ""}">

                <div class="vehicleTitle">

                    <div class="vehicleName">

                        ${icon}
                        Vehicle #${v.id}
                        ${v.class.toUpperCase()}

                    </div>

                    <div class="vehicleSpeed">

                        ${v.speed || 0}
                        KM/H

                    </div>

                </div>


                <div>

                    🎯 Confidence:
                    <b>
                        ${(v.score*100).toFixed(0)}%
                    </b>

                </div>


                <div>

                    📍 Status:
                    <b>
                        ${
                            over
                            ? "🔴 OVERSPEED"
                            : "🟢 SAFE"
                        }
                    </b>

                </div>


                <div class="plate">

                    🔢 Number Plate:
                    ${
                        v.plate ||
                        "Reading..."
                    }

                </div>

            </div>

            `;

        }
    );


    vehicleList.innerHTML =
    html;

}


/*
==================================================
VEHICLE ICON
==================================================
*/

function getVehicleIcon(type){

    if(type === "car")
        return "🚗";

    if(type === "motorcycle")
        return "🏍️";

    if(type === "bus")
        return "🚌";

    if(type === "truck")
        return "🚚";

    return "🚘";
}


/*
==================================================
DRAW CAMERA UI
==================================================
*/

function drawInterface(){

    if(!running)
        return;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const W =
    canvas.width;

    const H =
    canvas.height;


    /*
    START LINE
    */

    const line1 =
    H * .52;


    /*
    FINISH LINE
    */

    const line2 =
    H * .72;


    /*
    Start line
    */

    ctx.strokeStyle =
    "#00ff88";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(
        W*.03,
        line1
    );

    ctx.lineTo(
        W*.97,
        line1
    );

    ctx.stroke();


    /*
    Finish line
    */

    ctx.strokeStyle =
    "#00eaff";

    ctx.beginPath();

    ctx.moveTo(
        W*.03,
        line2
    );

    ctx.lineTo(
        W*.97,
        line2
    );

    ctx.stroke();


    /*
    Labels
    */

    ctx.font =
    "bold 14px Arial";


    ctx.fillStyle =
    "#00ff88";

    ctx.fillText(
        "START LINE",
        15,
        line1 - 10
    );


    ctx.fillStyle =
    "#00eaff";

    ctx.fillText(
        "FINISH LINE",
        15,
        line2 - 10
    );


    /*
    Vehicle boxes
    */

    vehicles.forEach(
        v => {

            const limit =
            Number(
                document.getElementById(
                    "speedLimit"
                ).value
            );


            const over =
            v.speed > limit;


            ctx.strokeStyle =
            over
            ? "#ff304f"
            : "#00ff88";


            ctx.lineWidth = 4;


            ctx.strokeRect(
                v.x,
                v.y,
                v.w,
                v.h
            );


            /*
            Label background
            */

            ctx.fillStyle =
            "rgba(0,0,0,.8)";


            ctx.fillRect(
                v.x,
                Math.max(
                    0,
                    v.y-52
                ),
                220,
                48
            );


            /*
            Label
            */

            ctx.fillStyle =
            over
            ? "#ff304f"
            : "#00ff88";


            ctx.font =
            "bold 14px Arial";


            ctx.fillText(

                "#" +
                v.id +
                " " +
                v.class.toUpperCase(),

                v.x + 7,
                Math.max(
                    17,
                    v.y - 32
                )

            );


            ctx.fillText(

                "SPEED: " +
                (v.speed || 0) +
                " KM/H",

                v.x + 7,
                Math.max(
                    35,
                    v.y - 13
                )

            );

        }
    );


    /*
    AI indicator
    */

    ctx.fillStyle =
    "rgba(0,0,0,.75)";

    ctx.fillRect(
        10,
        10,
        175,
        35
    );


    ctx.fillStyle =
    "#00ff88";

    ctx.font =
    "bold 14px Arial";

    ctx.fillText(
        "● AI CAMERA LIVE",
        20,
        33
    );

}


/*
==================================================
PAGE HIDDEN
==================================================
*/

document.addEventListener(
    "visibilitychange",
    function(){

        /*
        এখানে camera বন্ধ করছি না,
        যাতে screen lock/visibility
        পরিবর্তনে state নষ্ট না হয়।
        */

    }
);

</script>
